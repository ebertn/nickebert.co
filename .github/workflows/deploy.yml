name: CI and Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build:check

  deploy:
    name: Deploy to Cloudflare Workers
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://nickebert.co
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record rollback version
        run: |
          rollback_version="$(npx wrangler deployments status --json | jq -er '.versions[0].version_id' || echo none)"
          {
            echo "### Production deployment"
            echo
            echo "Rollback version: \`$rollback_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and deploy
        run: |
          npm run build
          npx wrangler deploy --tag "${GITHUB_SHA::12}" --message "Deploy $GITHUB_SHA"

      - name: Smoke-test production
        run: |
          homepage="$(mktemp)"
          trap 'rm -f "$homepage"' EXIT

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            https://nickebert.co/ > "$homepage"
          grep -Fq '<title>Nick Ebert - Senior Software Engineer</title>' "$homepage"

          content_type="$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --output /dev/null --write-out '%{content_type}' \
            https://nickebert.co/Nicholas-Ebert-Resume.pdf)"
          case "$content_type" in
            application/pdf*) ;;
            *) echo "Unexpected resume content type: $content_type" >&2; exit 1 ;;
          esac

          curl --fail --silent --show-error --output /dev/null \
            --retry 5 --retry-all-errors --retry-delay 3 \
            https://nickebert.co/atom-visualizer/

      - name: Record deployed version
        run: |
          deployed_version="$(npx wrangler deployments status --json | jq -er '.versions[0].version_id')"
          {
            echo
            echo "Deployed version: \`$deployed_version\`"
            echo "Commit: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
