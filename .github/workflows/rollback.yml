name: Roll Back Cloudflare Workers

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional Worker version ID; leave blank to use the previous version
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      url: https://nickebert.co
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ROLLBACK_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Roll back
        run: |
          if [[ -n "$ROLLBACK_VERSION" && ! "$ROLLBACK_VERSION" =~ ^[0-9a-f-]{36}$ ]]; then
            echo "Version must be a Worker version ID (UUID)." >&2
            exit 1
          fi
          # With no version ID, wrangler rolls back to the previous version.
          npx wrangler rollback $ROLLBACK_VERSION --yes --message "Rollback from GitHub Actions run $GITHUB_RUN_ID"
          npx wrangler deployments status >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test production
        run: |
          homepage="$(mktemp)"
          trap 'rm -f "$homepage"' EXIT

          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            https://nickebert.co/ > "$homepage"
          grep -Fq '<title>Nick Ebert - Senior Software Engineer</title>' "$homepage"
